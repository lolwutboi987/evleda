name: Release

on:
  push:
    tags:
      - "v*"

# Build/test has no authority to create a release. The short publish job is
# the only job with write permission, and consumes a GitHub-verified artifact
# rather than the repository checkout.
permissions:
  contents: read

jobs:
  build:
    name: Validate and build release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release_identity.outputs.tag }}
      release_version: ${{ steps.release_identity.outputs.version }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - id: release_identity
        name: Accept only an exact mainline SemVer tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "release tags must be exact vMAJOR.MINOR.PATCH SemVer values" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
          pyproject_version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"
          if [[ "$pyproject_version" != "$version" ]]; then
            echo "tag $RELEASE_TAG does not match pyproject version $pyproject_version" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main; then
            echo "release tag commit must be reachable from origin/main" >&2
            exit 1
          fi
          printf 'tag=%s\nversion=%s\n' "$RELEASE_TAG" "$version" >> "$GITHUB_OUTPUT"
      - name: Install public contributor toolchain
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Release-critical static analysis
        run: python scripts/check_release_static.py
      - name: Public tests (private evidence is explicitly deselected)
        run: python -m pytest -q --ignore=tests/kicad_worker/test_live_kicad.py
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify public archive boundary and licence notices
        run: python scripts/verify_public_distribution.py --dist dist
      - name: Install wheel from an unrelated directory and run MCP smoke
        run: python scripts/smoke_wheel.py
      - name: Assemble exactly the curated example assets
        run: python .github/scripts/package_release_examples.py --out release-assets
      - name: Verify exact release asset contract
        run: >-
          python .github/scripts/verify_release_assets.py --directory release-assets --dist dist
      - name: Write the exact release checksum manifest
        env:
          RELEASE_VERSION: ${{ steps.release_identity.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            "dist/evleda-${RELEASE_VERSION}-py3-none-any.whl" \
            "dist/evleda-${RELEASE_VERSION}.tar.gz" \
            release-assets/evleda-reference-usb-c-3v3-r2-source.zip \
            release-assets/evleda-reference-usb-c-3v3-r2-cam-candidate.zip \
            release-assets/preview.png \
            release-assets/README.md \
            release-assets/release-assets.json \
            > release-assets/SHA256SUMS.txt
          sha256sum --check release-assets/SHA256SUMS.txt
      - id: upload
        name: Upload immutable release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evleda-release-candidate
          if-no-files-found: error
          path: |
            dist/evleda-${{ steps.release_identity.outputs.version }}-py3-none-any.whl
            dist/evleda-${{ steps.release_identity.outputs.version }}.tar.gz
            release-assets/evleda-reference-usb-c-3v3-r2-source.zip
            release-assets/evleda-reference-usb-c-3v3-r2-cam-candidate.zip
            release-assets/preview.png
            release-assets/README.md
            release-assets/release-assets.json
            release-assets/SHA256SUMS.txt

  publish:
    name: Publish verified candidate
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      # download-artifact verifies the upload-artifact digest before exposing
      # files. This job intentionally does not check out or execute repository
      # code, preventing a tag's source tree from reaching release credentials.
      - id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: evleda-release-candidate
          path: candidate
      - name: Recheck candidate checksums and publish only approved files
        env:
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
          UPLOAD_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact_digest }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ -n "$UPLOAD_ARTIFACT_DIGEST" ]]
          cd candidate
          sha256sum --check release-assets/SHA256SUMS.txt
          expected_files=(
            "dist/evleda-${RELEASE_VERSION}-py3-none-any.whl"
            "dist/evleda-${RELEASE_VERSION}.tar.gz"
            "release-assets/evleda-reference-usb-c-3v3-r2-source.zip"
            "release-assets/evleda-reference-usb-c-3v3-r2-cam-candidate.zip"
            "release-assets/preview.png"
            "release-assets/README.md"
            "release-assets/release-assets.json"
            "release-assets/SHA256SUMS.txt"
          )
          actual_files=( $(find . -type f -printf '%P\n' | LC_ALL=C sort) )
          expected_sorted=( $(printf '%s\n' "${expected_files[@]}" | LC_ALL=C sort) )
          [[ "${actual_files[*]}" == "${expected_sorted[*]}" ]]
          gh release create "$RELEASE_TAG" \
            "dist/evleda-${RELEASE_VERSION}-py3-none-any.whl" \
            "dist/evleda-${RELEASE_VERSION}.tar.gz" \
            release-assets/evleda-reference-usb-c-3v3-r2-source.zip \
            release-assets/evleda-reference-usb-c-3v3-r2-cam-candidate.zip \
            release-assets/preview.png \
            release-assets/README.md \
            release-assets/release-assets.json \
            release-assets/SHA256SUMS.txt \
            --verify-tag --title "EvlEDA $RELEASE_TAG" --generate-notes
