name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Python test and packaging tools
        run: python -m pip install --upgrade pip
      - name: Install EvlEDA
        run: python -m pip install -e ".[dev]"
      - name: Check EvlEDA cloud POSIX shell syntax
        if: runner.os == 'Linux'
        shell: sh
        run: sh -n scripts/cloud/*.sh
      - name: Release-critical static analysis
        run: python scripts/check_release_static.py
      - name: Unit tests (no native KiCad execution)
        run: >-
          python -m pytest -q --ignore=tests/kicad_worker/test_live_kicad.py
      - name: Validate plugin and skill
        run: python .github/scripts/validate_plugin_skill.py
      - name: Test release-asset safety guards
        run: python -m unittest discover -s .github/scripts -p "*_test.py"
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify public archive boundary and licence notices
        run: python scripts/verify_public_distribution.py --dist dist
      - name: Install wheel from an unrelated directory and run MCP smoke
        run: python scripts/smoke_wheel.py
      - name: Validate curated example hashes
        run: python .github/scripts/package_release_examples.py --out release-assets

  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check licenses, tracked-state exclusions, and likely secrets
        run: python .github/scripts/check_repository_hygiene.py
