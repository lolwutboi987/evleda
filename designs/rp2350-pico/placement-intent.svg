    text{font-family:Arial,sans-serif;fill:#17212b} .title{font-size:24px;font-weight:700}.sub{font-size:13px;fill:#455564}.label{font-size:12px;font-weight:700}.small{font-size:10px}.note{font-size:14px}.head{font-size:17px;font-weight:700}.dim{font-size:12px;fill:#4f6070}.guide{fill:none;stroke:#85929d;stroke-width:1;stroke-dasharray:4 4}.lead{fill:none;stroke:#8795a2;stroke-width:1}.region{stroke-width:1.5;rx:3}.pin{fill:#f9e9b5;stroke:#947122;stroke-width:1}.warning{fill:#9c3c1d}
  </style>
