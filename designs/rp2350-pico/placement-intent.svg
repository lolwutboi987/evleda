  <text x="28" y="731" class="small">Dashed interior: 14.24 mm between stock header courtyards.</text>
  <text x="28" y="749" class="small warning">Stock header courtyards overrun the outline.</text>
  <text x="28" y="765" class="small warning">Mounting holes remain unresolved.</text>

