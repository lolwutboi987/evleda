<svg xmlns="http://www.w3.org/2000/svg" width="950" height="790" viewBox="0 0 950 790" role="img" aria-labelledby="title desc">
  <title id="title">RP2350 Pico-like provisional placement floorplan</title>
  <desc id="desc">A 21 by 51 millimetre board with correctly ordered 2.54 millimetre pitch headers, USB north, MCU centre, flash northwest, core buck northeast, analog east, crystal south, and a separate lower RT6150 power group. Regions are approximate. This is not native CAD, copper routing, or clearance validation.</desc>
