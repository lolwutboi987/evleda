  <text x="353" y="116" class="head">The placement logic</text>
  <text x="353" y="145" class="note">1. North-facing USB, ESD immediately behind it.</text>
  <text x="370" y="167" class="sub">Preserve both D+/D− contacts; explicit fan-in detours still needed.</text>
  <text x="353" y="205" class="note">2. U1's real pin domains set the orientation.</text>
  <text x="370" y="227" class="sub">QSPI northwest · core buck northeast · ADC east · crystal south.</text>
  <text x="353" y="265" class="note">3. The core group keeps the recorded reference topology.</text>
  <text x="370" y="287" class="sub">C1 input / L1 / C2 output / FB; C3 gets a separate quiet return.</text>
  <text x="370" y="309" class="sub">Generic 0402 lands differ: reference offsets alone do not qualify it.</text>
  <text x="353" y="347" class="note">4. Supply capacitors belong at their actual MCU pins.</text>
  <text x="370" y="369" class="sub">Separate C14/C15 and the USB/QSPI escape compete for real space.</text>
  <text x="353" y="407" class="note">5. Large RT6150 passives get a coherent lower group.</text>
  <text x="370" y="429" class="sub">Short local input/output loops; quiet C21-to-FB sense.</text>
  <text x="370" y="451" class="sub">Longer VSYS feed remains outside the sensitive analog/clock region.</text>
  <text x="353" y="489" class="note">6. BOOT, RUN and SWD remain physically accessible.</text>
  <text x="370" y="511" class="sub">Button mapping, cable/probe envelopes and mounting holes are open.</text>

  <rect x="350" y="552" width="564" height="133" fill="#f5ede9" stroke="#c9aa98"/>
  <text x="369" y="579" class="head warning">What this drawing does not prove</text>
  <text x="369" y="605" class="sub">No native board, clearance pass, USB route, completed plane or electrical rating.</text>
  <text x="369" y="627" class="sub">Package orientations may be cardinal; copper retains 45-degree turns.</text>
  <text x="369" y="649" class="sub">The exact 62-reference rationale and measured footprint bounds are in the plan.</text>
  <text x="369" y="671" class="sub">Board/header anchors use scale; coloured group boxes are approximate regions.</text>
  <text x="353" y="722" class="dim">Header pitch 2.54 mm · row spacing 17.78 mm · opposite numbering directions</text>
  <text x="353" y="745" class="dim">Source: selected circuit, v2 libraries, measured KiCad footprints, vendor references</text>
</svg>
